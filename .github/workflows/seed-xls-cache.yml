name: Seed XLS Cache (Split-Phase)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Select the compilation phase to execute'
        required: true
        default: '1_common'
        type: choice
        options:
          - '1_common'
          - '2_ir_and_dslx'
          - '3_jit_and_passes'
          - '4_remaining'

jobs:
  incremental-build:
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Map target string patterns to the user's selected phase choice
      - name: Set Target Variables
        id: targets
        run: |
          if [ "${{ github.event.inputs.phase }}" = "1_common" ]; then
            echo "target=//xls/common/..." >> $GITHUB_OUTPUT
            echo "next_phase=2_ir_and_dslx" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.phase }}" = "2_ir_and_dslx" ]; then
            echo "target=//xls/ir/... //xls/dslx/..." >> $GITHUB_OUTPUT
            echo "next_phase=3_jit_and_passes" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.phase }}" = "3_jit_and_passes" ]; then
            echo "target=//xls/jit/... //xls/passes/... //xls/scheduling/..." >> $GITHUB_OUTPUT
            echo "next_phase=4_remaining" >> $GITHUB_OUTPUT
          else
            # Only compile what's left, skipping the heavy lifters already cached
            echo "target=//xls/... -//xls/common/... -//xls/ir/... -//xls/dslx/... -//xls/jit/... -//xls/passes/... -//xls/scheduling/... -//xls/contrib/... -//xls/dev_tools/..." >> $GITHUB_OUTPUT
            echo "next_phase=none" >> $GITHUB_OUTPUT
          fi

      # 2. Pull down existing cache fragments from ANY prior run
      - name: Restore Bazel Cache
        uses: actions/cache/restore@v4
        with:
          path: .bazel_disk_cache
          key: bazel-split-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bazel-split-cache-${{ runner.os }}-

      # 3. Build the Docker container using our local extracted cache folder
      - name: Compile Selected Phase
        run: |
          mkdir -p .bazel_disk_cache
          docker build . \
            -f Dockerfile-ubuntu-22.04 \
            --build-arg BUILD_TARGET="${{ steps.targets.outputs.target }}" \
            -t xls-phase-builder:latest

      # 4. Extract the newly produced cache artifacts out of the container
      - name: Extract Cache Files from Container
        if: success() || cancelled()
        run: |
          # Pass 'true' as a dummy command so the scratch layout can be initialized
          id=$(docker create xls-phase-builder:latest true)          
          # Copy from the scratch stage's root location
          docker cp $id:/bazel_disk_cache/. .bazel_disk_cache/
          docker rm -v $id
          
      # 5. Overwrite the persistent GitHub Actions cache state with a rolling key
      - name: Save Updated Bazel Cache
        uses: actions/cache/save@v4
        if: success() || cancelled()
        with:
          path: .bazel_disk_cache
          # Using run_id + run_attempt ensures a unique save key every single time
          key: bazel-split-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 6. Chain to the next phase automatically if successful
      - name: Trigger Next Phase
        if: success() && steps.targets.outputs.next_phase != 'none'
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/seed-xls-cache.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"phase":"${{ steps.targets.outputs.next_phase }}"}}'

      # 7. Only when the final phase finishes successfully, bundle and upload the complete image
      - name: Save and Upload Final Docker Image
        if: success() && github.event.inputs.phase == '4_remaining'
        run: |
          echo "Packaging final compiled Docker image..."
          docker save xls-phase-builder:latest -o xls-final-image.tar

      - name: Publish Image Artifact
        if: success() && github.event.inputs.phase == '4_remaining'
        uses: actions/upload-artifact@v4
        with:
          name: xls-compiled-docker-image
          path: xls-final-image.tar
          retention-days: 7
